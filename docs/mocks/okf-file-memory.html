 if(remember){const fact=text.replace(/^remember\s+(that\s+)?/i,'').trim();let c=s.concepts.find(c=>c.origin==='active_memory'&&c.body.toLowerCase()===fact.toLowerCase()),tool='memory_remember';if(c){c.history.push(c.body);c.status='draft';c.verified=false;tool='memory_update'}else{const source=sources.length;sources.push({name:'Conversation · '+state.agentName,type:'Conversation',detail:'User requested durable memory',size:'1 message',date:'Today',excerpt:text});c={id:'facts/agent-note-'+(s.concepts.filter(c=>c.origin==='active_memory').length+1),title:fact.slice(0,65),description:fact,body:fact,type:'Fact',verified:false,status:'draft',gov:'context',tags:['agent'],source,origin:'active_memory',actor:'agent/'+state.agentName,related:active(s)[0]?[active(s)[0].id]:[],history:[]};s.concepts.push(c)}calls.push({name:tool,text:'Saved to '+(s.kind==='okf'?s.path+c.id+'.md':s.name)+'. Origin: active_memory. Generated by '+state.agentName+'.',id:c.id});answer='I’ll remember that. It is available in your memory graph.';s.jobs??=[];s.jobs.unshift({title:'Agent saved a memory',desc:'Active Memory · '+typeName(s.kind)+' · graph refreshed',ico:'bot'})}
 else if(forget||update){const c=owned.at(-1);if(c){c.history.push(c.body);c.verified=false;if(forget)c.status='deprecated';else{c.body=text.replace(/^(update|correction)\s*:?\s*/i,'');c.description=c.body}calls.push({name:forget?'memory_remove':'memory_update',text:forget?'Marked the agent memory inactive. File and history retained.':'Updated the agent memory and retained its previous value.',id:c.id});answer=forget?'I’ve forgotten that memory. Its history is retained.':'I’ve updated that memory.'}else answer='There is no matching agent-saved memory to change. Source-built knowledge remains read-only to these tools.'}
 else{const found=active(s).filter(c=>matches(c,text));for(const c of found.slice(0,3))calls.push({name:'memory_explain_source',text:c.body+' Source: '+sourceName(c),id:c.id});answer=found.length?'Here is the matching knowledge from your memory.':'No matching memory found. Try a keyword from your saved knowledge.'}
 state.messages.push({kind:'agent',calls,text:answer,space:s.id});renderChat();
}
function memoryDialog(agent=false,editing=null){
 state.createForAgent=agent;state.editing=editing;const s=editing?spaces.find(s=>s.id===editing):null;state.newKind=s?.kind||'graph';
 $('#memory-dialog').innerHTML=`<form id="memory-form"><div class="dialog-head"><div class="grow"><h2 id="memory-dialog-title">${agent?'Create agent':s?'Edit memory':'New Memory'}</h2><p>${agent?'Create a preset with its own memory.':'Create a memory space to organize your knowledge.'}</p></div>${close('memory-dialog')}</div><div class="dialog-body"><div class="form-group"><label class="label" for="memory-name">${agent?'Agent name':'Memory name'} *</label><input class="field" id="memory-name" value="${esc(s?.name||'')}" placeholder="${agent?'My agent':'e.g. Project knowledge'}" required maxlength="64"></div>${agent?'':`<div class="form-group"><label class="label" for="memory-purpose">Goal / purpose *</label><textarea class="field" id="memory-purpose" rows="3" placeholder="What should this memory focus on?" required maxlength="240">${esc(s?.description||'')}</textarea></div>`}<div class="form-grid"><div class="form-group"><label class="label" for="grow-type">Grow type</label><select class="field" id="grow-type">${[['graph','Semantic Graph'],['structmem','StructMem'],['okf','OKF Files · New']].map(([id,label])=>`<option value="${id}" ${state.newKind===id?'selected':''}>${label}</option>`).join('')}</select></div><div class="form-group"><label class="label" for="recall-type">Recall type</label><select class="field" id="recall-type"></select></div></div><div id="okf-config" ${state.newKind==='okf'?'':'hidden'}><label class="label" for="bundle-path">Memory folder</label><input class="field mono" id="bundle-path" value="${esc(s?.path||'knowledge/')}" placeholder="knowledge/"><p class="help">Concepts are saved as Markdown files. Graph view and Active Memory use this same bundle.</p></div></div><div class="dialog-foot"><button class="btn" type="button" data-close="memory-dialog">Cancel</button><button class="btn primary" type="submit">${agent?'Create agent':s?'Save changes':'Create memory'}</button></div></form>`;
 updateGrowFields();openDialog('memory-dialog');
}
function updateGrowFields(){state.newKind=$('#grow-type').value;const opts=state.newKind==='graph'?['Smart','Quick','LLM']:state.newKind==='okf'?['BM25']:['StructMem'];$('#recall-type').innerHTML=opts.map(t=>`<option>${t}</option>`).join('');$('#recall-type').disabled=opts.length===1;$('#okf-config').hidden=state.newKind!=='okf';$('#bundle-path').required=state.newKind==='okf'}
function saveMemory(){
 const name=$('#memory-name').value.trim(),desc=$('#memory-purpose')?.value.trim()||'Memory for '+name,path=$('#bundle-path').value.trim();if(!name||!desc||(state.newKind==='okf'&&!path))return;
 let s=spaces.find(s=>s.id===state.editing);if(s){s.name=name;s.description=desc;s.kind=state.newKind;s.path=path.replace(/\/*$/,'/')}else{s={id:'memory-'+spaces.length,name:state.createForAgent?name+' memory':name,kind:state.newKind,description:desc,path:path.replace(/\/*$/,'/'),concepts:[],pending:0};spaces.push(s)}
 state.space=s.id;state.node=null;state.query='';state.tab='overview';$('#memory-dialog').close();
 if(state.createForAgent){agents.push({id:'agent-'+agents.length,name,memory:s.id,active:true});state.agentName=name;state.boundSpace=s.id;state.chatSpace=s.id;state.activeMemory=true;state.draftActive=true;state.surface='agents'}render();toast(state.editing?'Memory updated.':state.createForAgent?'Agent created.':'Memory created.');
}
function notes(){
 const rows=[['Memory creation','Add OKF Files to the current Grow type select in New Memory and agent creation. Recall is paired with BM25. Only the bundle folder field is conditional.',refs.repo,'OKF Agent Memory'],['Memory Page','Keep Overview, Semantic, Sources, and Activity. Existing sidebar search dispatches by type. For OKF, graph nodes are concept files and connections come from Markdown links. Selecting a node uses the current inspector; Open file uses Files.',refs.format,'Format, indexes, and links'],['Files conversion','Reuse the existing file row action and KnowledgeConversionDialog destination list. Extend that same Convert to Knowledge action to folders, with subfolder inclusion and supported-file resolution. Existing folder Indexes and OKF cards remain separate from this new memory type.',refs.start,'Build and persistence workflow'],['Active Memory','Keep the existing Features card, toggle, tools, and normal chat flow. Route memory_retrieve to BM25 plus selected concept reads; route memory_remember/update/remove/explain_source to the OKF adapter. Keep all/active scope, inactive filtering, stable IDs, provenance, ownership restrictions, and history.',refs.convention,'Agent memory convention'],['Storage and writes','Memory content stays in Markdown plus YAML, index.md, and log.md. App settings and jobs can remain in the database. Search before writing, preserve unknown fields and source references, validate changes, refresh graph and recall, and leave generated content unverified.',refs.cli,'CLI & MCP operations'],['Selective recall','Keep operating instructions compact and retrieve domain knowledge on demand. BM25 is lexical retrieval; it does not require embeddings. No reference benchmark numbers are promised in this mock.',refs.dmaa,'Dual-memory architecture']];
 $('#detail-dialog').className='notes';$('#detail-dialog').innerHTML=`<div class="dialog-head"><div class="grow"><h2 id="detail-title">OKF memory · integration notes</h2><p>One new memory type through the existing Memorall screens and controls.</p></div>${close('detail-dialog')}</div><div class="dialog-body"><p class="help" style="margin-top:0">Review paths: New Memory → Grow type; Memory → sidebar search / Semantic; Files → row menu → Convert to Knowledge; Agents → Active Memory; normal chat → “Remember that release notes should include source links.” All actions are simulated and reset on reload.</p>${rows.map(([title,body,url,label])=>`<article class="note"><h3>${title}</h3><p>${body}</p><a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a></article>`).join('')}<article class="note"><h3>Implementation boundary</h3><p>Current Active Memory tools are database-graph-specific. Supporting files requires a backend adapter and typed memory routing. This HTML demonstrates the proposed integration; it does not implement that adapter or change app behavior.</p><p class="tiny">UI references: KnowledgeGraphPage, CreateTopicDialog, AgentMemoryTypeControls, DocumentList, KnowledgeConversionDialog, FeatureCard, and MemoryTool.</p></article></div><div class="dialog-foot"><button class="btn" data-close="detail-dialog">Close</button></div>`;openDialog('detail-dialog');
}
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-node]');if(node){state.node=node.dataset.node;state.nodeTab='summary';renderMemory();return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.close){e.preventDefault();$('#'+b.dataset.close).close();return}
 if(b.dataset.surface){navigate(b.dataset.surface);return}
 if(b.dataset.space){state.space=b.dataset.space;state.node=null;state.query='';renderMemory();return}
 if(b.dataset.tab){state.tab=b.dataset.tab;renderMemory();return}
 if(b.dataset.nodeTab){state.nodeTab=b.dataset.nodeTab;renderMemory();return}
 if(b.dataset.editSpace){memoryDialog(false,b.dataset.editSpace);return}
 if(b.dataset.folder){state.folder=b.dataset.folder;state.viewer=null;state.menu=null;renderFiles();return}
 if(b.dataset.viewSource!==undefined){state.surface='files';state.viewer={kind:'source',id:Number(b.dataset.viewSource)};state.menu=null;render();return}
 if(b.dataset.openConcept){state.surface='files';state.viewer={kind:'concept',id:b.dataset.openConcept};state.raw=false;render();return}
 if(b.dataset.fileMenu){state.menu=state.menu===b.dataset.fileMenu?null:b.dataset.fileMenu;renderFiles();return}
 if(b.dataset.convert){state.convertEntry=b.dataset.convert;state.convertSpace='default';state.menu=null;state.recursive=true;renderFiles();conversionDialog();return}
 if(b.dataset.agent){const a=agents.find(a=>a.id===b.dataset.agent);state.agentName=a.name;state.boundSpace=a.memory;state.chatSpace=a.memory;state.activeMemory=a.active;state.draftActive=a.active;render();return}
 if(b.dataset.chatMemory){state.space=b.dataset.chatMemory;state.node=b.dataset.chatNode;state.tab='semantic';state.query='';navigate('memory');return}
 switch(b.dataset.action){
  case 'notes':notes();break;
  case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;
  case 'sidebar':if(matchMedia('(min-width:761px)').matches)document.body.classList.toggle('sidebar-collapsed');else $('#sidebar').classList.toggle('open');break;
  case 'new-memory':memoryDialog();break;
  case 'new-agent':memoryDialog(true);break;
  case 'open-files':navigate('files');break;
  case 'close-node':state.node=null;renderMemory();break;
  case 'zoom-in':state.zoom=Math.min(1.8,state.zoom+.15);renderMemory();break;
  case 'zoom-out':state.zoom=Math.max(.5,state.zoom-.15);renderMemory();break;
  case 'zoom-fit':state.zoom=1;renderMemory();break;
  case 'viewer-back':state.viewer=null;renderFiles();break;
  case 'raw-file':state.raw=!state.raw;renderFiles();break;
  case 'convert-viewer':state.convertEntry=libraryEntries.find(e=>e.source===state.viewer.id)?.id;state.convertSpace='default';if(state.convertEntry)conversionDialog();else toast('This source is already a conversation.');break;
  case 'convert':void convert();break;
  case 'open-converted':state.space=state.lastConverted;state.node=null;state.tab='overview';state.query='';$('#toast').hidden=true;navigate('memory');break;
  case 'open-agent-memory':state.space=state.boundSpace;state.tab='semantic';state.node=null;state.query='';navigate('memory');break;
  case 'active-detail':activeDetail();break;
  case 'save-agent':state.activeMemory=state.draftActive;agents.find(a=>a.name===state.agentName).active=state.activeMemory;renderAgents();toast('Changes saved.');break;
  case 'new-chat':state.messages=[];state.chatText='';renderChat();break;
  case 'copy-path':toast('Path action preview.');state.menu=null;renderFiles();break;
  case 'folder-indexes':toast('Existing folder index controls stay separate from memory type.');state.menu=null;renderFiles();break;
  case 'add-file':case 'prototype-only':toast('This mock focuses on the new memory type.');break;
  case 'unsupported':toast('Archive extraction is outside this mock.');break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='node-search'){state.query=e.target.value;$('#node-list').innerHTML=nodeRows();$('#node-count').textContent=filtered().length+' / '+active().length+' nodes';document.querySelectorAll('.canvas .graph-node').forEach(n=>{const c=current().concepts.find(c=>c.id===n.dataset.node);n.setAttribute('opacity',matches(c,state.query)?'1':'.2')})}
 if(e.target.id==='file-search'){state.fileQuery=e.target.value;const content=$('#content');content.innerHTML=fileRows()}
 if(e.target.id==='chat-input')state.chatText=e.target.value;
});
document.addEventListener('change',e=>{
 if(e.target.id==='grow-type')updateGrowFields();
 if(e.target.name==='destination'){state.convertSpace=e.target.value;conversionDialog()}
 if(e.target.id==='include-subfolders'){state.recursive=e.target.checked;conversionDialog()}
 if(e.target.id==='file-memory'){state.fileMemory=e.target.value;$('#content').innerHTML=fileRows()}
 if(e.target.id==='active-memory-toggle'){state.draftActive=e.target.checked;renderAgents()}
 if(e.target.id==='chat-memory')state.chatSpace=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='memory-form'){e.preventDefault();saveMemory()}if(e.target.id==='chat-form'){e.preventDefault();state.chatText=$('#chat-input').value;sendMessage()}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-node]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();state.chatText=e.target.value;sendMessage()}});
document.addEventListener('click',e=>{if(state.menu&&!e.target.closest('.context')){state.menu=null;document.querySelectorAll('.dropdown').forEach(d=>d.remove())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu){state.menu=null;document.querySelectorAll('.dropdown').forEach(d=>d.remove())}if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role=tab]')];let i=tabs.indexOf(e.target);i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const id=tabs[i].id;tabs[i].click();$('#'+id).focus()}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
render();
